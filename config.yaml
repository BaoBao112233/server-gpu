models:
  # Recommended models for GTX 1050 Ti (4GB VRAM)
  small:
    - name: "phi3:mini"
      backend: "ollama"
      description: "Microsoft Phi-3 Mini (3.8B) - Best for low VRAM"
      ram_required: "4GB"
      
    - name: "llama3.2:1b"
      backend: "ollama"
      description: "Llama 3.2 1B - Ultra fast, minimal resources"
      ram_required: "2GB"
      
    - name: "qwen2.5:1.5b"
      backend: "ollama"
      description: "Qwen 2.5 1.5B - Efficient multilingual model"
      ram_required: "2GB"
      
    - name: "gemma:2b"
      backend: "ollama"
      description: "Google Gemma 2B - Compact and capable"
      ram_required: "3GB"

  # Models for servers with more VRAM (8GB+)
  medium:
    - name: "llama3.1:8b"
      backend: "ollama"
      description: "Llama 3.1 8B - Powerful general purpose"
      ram_required: "8GB"
      
    - name: "mistral:7b"
      backend: "ollama"
      description: "Mistral 7B - Excellent performance"
      ram_required: "8GB"
      
    - name: "gemma2:9b"
      backend: "ollama"
      description: "Google Gemma 2 9B - Latest from Google"
      ram_required: "10GB"

  # Models for high-end servers (24GB+ VRAM)
  large:
    - name: "llama3.1:70b"
      backend: "ollama"
      description: "Llama 3.1 70B - High performance"
      ram_required: "40GB"
      
    - name: "mixtral:8x7b"
      backend: "ollama"
      description: "Mixtral 8x7B - MoE architecture"
      ram_required: "48GB"

# Default generation settings
generation:
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  max_tokens: 2048
  repeat_penalty: 1.1

# Server limits
server:
  max_concurrent_requests: 5
  request_timeout: 300
  max_content_length: 10000
